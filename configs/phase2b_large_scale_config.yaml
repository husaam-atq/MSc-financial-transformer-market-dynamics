project:
  name: "Interpretable Transformer Models for Financial Time Series Forecasting"
  seed: 42

paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  manifests: "data/manifests"
  reports_tables: "reports/tables"
  reports_figures: "reports/figures"
  results_runs: "results/runs"

phase2b:
  daily:
    universe: "configs/universes/daily_global_universe.csv"
    start_date: "2010-01-01"
    end_date: null
    yahoo_batch_size: 20
    max_retries: 4
    retry_backoff_seconds: 2.0
    min_history_rows: 1260
    min_instruments: 80
    stooq_crosscheck_count: 20
    fred_series: ["DFF", "DGS2", "DGS10", "T10Y2Y", "VIXCLS", "BAMLH0A0HYM2", "DTWEXBGS"]
    fred_market_day_lag: 1
    target_horizons: [1, 5, 10]
    targets:
      direction_horizons: [1, 5, 10]
      volatility_horizons: [5, 10]
      stress:
        enabled: true
        horizon: 10
        large_negative_return: -0.05
        volatility_spike_multiplier: 2.0
        drawdown_threshold: -0.07
  crypto_hourly:
    universe: "configs/universes/crypto_hourly_universe.csv"
    start_date: "2017-01-01"
    end_date: null
    interval: "1h"
    max_retries: 4
    retry_backoff_seconds: 2.0
    min_history_rows: 8760
    target_horizons: [1, 4, 24]
    ccxt_recent_days: 30
  split:
    train_size: 0.60
    val_size: 0.20
    test_size: 0.20
    # The experiment runner applies the relevant target horizon as purge.
    purge: 0
    embargo: 1
  screening:
    daily_assets: ["SPY", "QQQ", "IWM", "EEM", "TLT", "HYG", "GLD", "USO", "VNQ", "UUP", "BTC-USD", "ETH-USD"]
    crypto_assets: ["BTC/USDT", "ETH/USDT", "BNB/USDT", "XRP/USDT", "ADA/USDT", "SOL/USDT", "DOGE/USDT", "LINK/USDT", "DOT/USDT", "UNI/USDT"]
    daily_lookback: 60
    hourly_lookback: 168
    seeds: [7, 42, 123]
    daily_targets: ["target_direction_5d", "target_log_realized_vol_5d", "target_stress_10d"]
    hourly_targets: ["target_direction_4h", "target_log_realized_vol_4h", "target_stress_24h"]
    # Layer 1 is a deterministic, stratified architecture screen. Each asset
    # contributes uniformly spaced windows from each development segment.
    # Full-window learning is reserved for Layer 2 and Phase 2C.
    max_train_windows_per_asset: 128
    max_evaluation_windows_per_asset: 256
    epochs: 10
  models:
    classical: ["majority", "previous_direction", "historical_mean", "logistic_regression", "elastic_net_logistic", "random_forest", "xgboost", "lightgbm", "catboost", "ewma", "har_rv", "garch", "arima", "arimax"]
    deep: ["mlp", "lstm", "gru", "bilstm", "tcn", "transformer_encoder", "patchtst", "itransformer", "tft", "timesnet", "informer", "autoformer", "fedformer", "nbeats", "nhits", "dlinear", "nlinear"]
  training:
    device: "auto"
    mixed_precision: true
    batch_size: 512
    epochs: 30
    learning_rate: 0.001
    weight_decay: 0.0001
    gradient_clip_norm: 1.0
    early_stopping_patience: 5
    lr_scheduler_patience: 2
    lr_scheduler_factor: 0.5
    num_workers: 0
    deterministic: true
  model:
    hidden_size: 64
    dropout: 0.15
    num_layers: 2
    transformer_heads: 4
    transformer_ff_multiplier: 2
    patch_length: 10
    patch_stride: 5
    asset_embedding_dim: 12
