   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="43.2" y="46.716094" transform="rotate(-0 43.2 46.716094)">When does pooled forecasting measure temporal skill?</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #70838a" x="43.2" y="62.418047" transform="rotate(-0 43.2 62.418047)">A multi-asset Transformer examined through static, within-asset, identity and order controls</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2a7f8e" x="66.96" y="111.888" transform="rotate(-0 66.96 111.888)">DAILY MULTI-ASSET INPUT</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="66.96" y="140.398594" transform="rotate(-0 66.96 140.398594)">79 evaluated instruments / 6 families</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="66.96" y="160.054594" transform="rotate(-0 66.96 160.054594)">60 observed sessions x 34 numerical channels</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="66.96" y="179.710594" transform="rotate(-0 66.96 179.710594)">+ 12-D learned asset embedding</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #486a9a" x="434.16" y="111.888" transform="rotate(-0 434.16 111.888)">TRANSFORMER</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="434.16" y="140.398594" transform="rotate(-0 434.16 140.398594)">2-layer encoder + temporal attention</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="434.16" y="160.053891" transform="rotate(-0 434.16 160.053891)">272,449 parameters</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="434.16" y="179.710594" transform="rotate(-0 434.16 179.710594)">Pooled ROC-AUC  0.790</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94a48" x="801.36" y="111.888" transform="rotate(-0 801.36 111.888)">POOLED SCORE LOOKS STRONG</text>
   </g>
   <g id="text_12">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="801.36" y="140.397891" transform="rotate(-0 801.36 140.397891)">ROC-AUC  0.790</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="801.36" y="160.053891" transform="rotate(-0 801.36 160.053891)">PR-AUC    0.421</text>
   </g>
   <g id="text_14">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="801.36" y="179.710594" transform="rotate(-0 801.36 179.710594)">But pooled ranking mixes within- and between-asset pairs</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #70838a" x="43.2" y="244.777422" transform="rotate(-0 43.2 244.777422)">ADVERSARIAL CHECKS</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c38d2e" x="66.96" y="288.288" transform="rotate(-0 66.96 288.288)">STATIC BENCHMARK</text>
   </g>
   <g id="text_17">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="66.96" y="316.798594" transform="rotate(-0 66.96 316.798594)">Asset prior pooled AUC  0.824</text>
   </g>
   <g id="text_18">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="66.96" y="336.454594" transform="rotate(-0 66.96 336.454594)">Training labels only; score is constant through time</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2a7f8e" x="412.56" y="288.288" transform="rotate(-0 412.56 288.288)">WITHIN-ASSET ESTIMAND</text>
   </g>
   <g id="text_20">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="412.56" y="316.798594" transform="rotate(-0 412.56 316.798594)">Transformer within-asset AUC  0.492</text>
   </g>
   <g id="text_21">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="412.56" y="336.454594" transform="rotate(-0 412.56 336.454594)">Approximately chance ranking within the same instrument</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b94a48" x="758.16" y="288.288" transform="rotate(-0 758.16 288.288)">IDENTITY + ORDER TESTS</text>
   </g>
   <g id="text_23">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="758.16" y="316.798594" transform="rotate(-0 758.16 316.798594)">No asset ID pooled AUC  0.715</text>
   </g>
   <g id="text_24">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="758.16" y="336.454594" transform="rotate(-0 758.16 336.454594)">Largest registered order change  0.0014</text>
   </g>
   <g id="text_25">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #486a9a" x="66.96" y="419.328" transform="rotate(-0 66.96 419.328)">CONTROLLED SIMULATION</text>
   </g>
   <g id="text_26">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="66.96" y="447.838594" transform="rotate(-0 66.96 447.838594)">1,040 registered runs</text>
   </g>
   <g id="text_27">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="66.96" y="467.494594" transform="rotate(-0 66.96 467.494594)">Static heterogeneity inflates pooled AUC; planted ordered signal restores sensitivity</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="617.76" y="419.328" transform="rotate(-0 617.76 419.328)">DIAGNOSTIC CONCLUSION</text>
   </g>
   <g id="text_29">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="617.76" y="447.838594" transform="rotate(-0 617.76 447.838594)">High pooled discrimination did not establish robust temporal skill.</text>
   </g>
   <g id="text_30">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17252a" x="617.76" y="467.494594" transform="rotate(-0 617.76 467.494594)">Evaluate pooled models with within-asset, identity and order controls.</text>
   </g>
  </g>
 </g>
