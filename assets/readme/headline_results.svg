<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title description">
  <title id="title">Pooled discrimination versus within-asset discrimination</title>
  <desc id="description">A common zero-to-one AUC scale compares the static asset prior, Transformer and MLP. Their pooled AUC values are 0.824, 0.790 and 0.796; their within-asset AUC values are 0.500, 0.492 and 0.557. No learned model passed the strict ordered-temporal-skill gate.</desc>
  <rect x="1" y="1" width="1198" height="608" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#1f2328">
    <text x="48" y="58" font-size="28" font-weight="700">Pooled versus within-asset discrimination</text>
    <text x="48" y="88" font-size="17" fill="#57606a">ROC-AUC on a shared 0-1 scale; 0.50 marks chance ranking.</text>

    <g font-size="16" font-weight="600">
      <circle cx="778" cy="76" r="7" fill="#0969da"/>
      <text x="794" y="82">Pooled</text>
      <rect x="897" y="69" width="14" height="14" fill="#9a6700"/>
      <text x="921" y="82">Within asset</text>
    </g>

    <line x1="260" y1="126" x2="1120" y2="126" stroke="#8c959f" stroke-width="2"/>
    <g font-size="14" fill="#57606a" text-anchor="middle">
      <text x="260" y="151">0.0</text>
      <text x="432" y="151">0.2</text>
      <text x="604" y="151">0.4</text>
      <text x="776" y="151">0.6</text>
      <text x="948" y="151">0.8</text>
      <text x="1120" y="151">1.0</text>
    </g>
    <g stroke="#d0d7de" stroke-width="1">
      <line x1="260" y1="126" x2="260" y2="520"/>
      <line x1="432" y1="126" x2="432" y2="520"/>
      <line x1="604" y1="126" x2="604" y2="520"/>
      <line x1="776" y1="126" x2="776" y2="520"/>
      <line x1="948" y1="126" x2="948" y2="520"/>
      <line x1="1120" y1="126" x2="1120" y2="520"/>
    </g>
    <line x1="690" y1="116" x2="690" y2="520" stroke="#57606a" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="690" y="542" font-size="14" text-anchor="middle" fill="#57606a">chance 0.50</text>

    <g>
      <text x="48" y="216" font-size="21" font-weight="700">Static asset prior</text>
      <text x="48" y="241" font-size="15" fill="#57606a">Non-temporal benchmark</text>
      <line x1="260" y1="202" x2="968.6" y2="202" stroke="#0969da" stroke-width="13" stroke-linecap="round"/>
      <circle cx="968.6" cy="202" r="9" fill="#0969da"/>
      <text x="984" y="208" font-size="17" font-weight="700">0.824</text>
      <line x1="260" y1="238" x2="690" y2="238" stroke="#9a6700" stroke-width="13" stroke-linecap="round"/>
      <rect x="682" y="230" width="16" height="16" fill="#9a6700"/>
      <text x="706" y="244" font-size="17" font-weight="700">0.500</text>
    </g>

    <g>
      <text x="48" y="340" font-size="21" font-weight="700">Transformer</text>
      <text x="48" y="365" font-size="15" fill="#57606a">Temporal gate failed</text>
      <line x1="260" y1="326" x2="939.4" y2="326" stroke="#0969da" stroke-width="13" stroke-linecap="round"/>
      <circle cx="939.4" cy="326" r="9" fill="#0969da"/>
      <text x="955" y="332" font-size="17" font-weight="700">0.790</text>
      <line x1="260" y1="362" x2="683.1" y2="362" stroke="#9a6700" stroke-width="13" stroke-linecap="round"/>
      <rect x="675.1" y="354" width="16" height="16" fill="#9a6700"/>
      <text x="707" y="368" font-size="17" font-weight="700">0.492</text>
    </g>

    <g>
      <text x="48" y="464" font-size="21" font-weight="700">MLP</text>
      <text x="48" y="489" font-size="15" fill="#57606a">Temporal gate failed</text>
      <line x1="260" y1="450" x2="944.6" y2="450" stroke="#0969da" stroke-width="13" stroke-linecap="round"/>
      <circle cx="944.6" cy="450" r="9" fill="#0969da"/>
      <text x="960" y="456" font-size="17" font-weight="700">0.796</text>
      <line x1="260" y1="486" x2="739.0" y2="486" stroke="#9a6700" stroke-width="13" stroke-linecap="round"/>
      <rect x="731" y="478" width="16" height="16" fill="#9a6700"/>
      <text x="763" y="492" font-size="17" font-weight="700">0.557</text>
    </g>

    <text x="48" y="579" font-size="15" fill="#57606a">Bars start at 0.0. Shape and text labels duplicate colour encoding.</text>
  </g>
</svg>
